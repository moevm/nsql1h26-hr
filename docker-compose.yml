services:
  swagger-service:
    container_name: swagger-container
    image: swaggerapi/swagger-ui:v5.32.5
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8080}:8080"
    environment:
      SWAGGER_JSON: /openapi.yaml
    volumes:
      - ./openapi.yaml:/openapi.yaml:ro
    networks:
      - hr-network

  frontend-service:
    container_name: frontend-container
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v2}
    environment:
      - PORT=${FRONTEND_PORT:-5173}
      - CHOKIDAR_USEPOLLING=true
      - VITE_HOST=0.0.0.0
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v2}
    ports:
      - "${FRONTEND_HOST:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend-service
    networks:
      - hr-network

  backend-service:
    image: backend-image
    container_name: backend-container
    build:
      context: ./backend
      args:
        - SECRET_KEY=${SECRET_KEY}
    ports:
      - "${BACKEND_HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    environment:
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_URI=bolt://neo4j-container:7687
      - SECRET_KEY=${SECRET_KEY}
      - BACKEND_PORT=${BACKEND_PORT:-8000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hr-network

  db:
    image: neo4j:5
    container_name: neo4j-container
    expose:
      - "7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_config:/config
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hr-network


networks:
  hr-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_config:
  neo4j_plugins:
