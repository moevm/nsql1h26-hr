services:

  swagger-service:
    container_name: swagger-container
    image: swaggerapi/swagger-ui
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SWAGGER_JSON: /openapi.yaml
    volumes:
      - ./openapi.yaml:/openapi.yaml
  frontend-service:
    container_name: frontend-container
    build:
      context: ./frontend
    environment:
      - PORT=5173
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend-service
    
  backend-service:
    image: backend-image
    container_name: backend-container
    build:
      context:
        ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_URI=bolt://neo4j-container:7687
    depends_on:
      db:
        condition: service_healthy
    
  db:
    image: neo4j:5
    container_name: neo4j-container
    expose:
      - "7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_config:/config
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_config:
  neo4j_plugins:
