services:
  backend-service:
    image: backend-image
    container_name: backend-container
    build:
      context:
        ./backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_URI=bolt://neo4j-container:7687
    depends_on:
      neo4j-service:
        condition: service_healthy
    
  neo4j-service:
    image: neo4j:5
    container_name: neo4j-container
    ports:
      - "7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/config:/config
      - ./neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    