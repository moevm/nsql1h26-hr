services:
  backend-service:
    image: backend-image
    container_name: backend-container
    build:
      context:
        ./backend
    
  neo4j-service:
    image: neo4j:5
    container_name: neo4j-container
    ports:
      - "7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/config:/config
      - ./neo4j/plugins:/plugins
    