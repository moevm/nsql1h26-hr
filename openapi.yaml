  # ==================== Interviews ====================
  /v2/interviews:
    get:
      summary: Список интервью
      tags: [Interviews]
      parameters:
        # Прямые поля
        - name: candidate_id
          in: query
          schema: { type: string, format: uuid }
        - name: candidate_name
          in: query
          schema: { type: string }
          description: Поиск по имени кандидата
        - name: tech_spec_id
          in: query
          schema: { type: string, format: uuid }
        - name: tech_spec_name
          in: query
          schema: { type: string }
          description: Поиск по имени техспециалиста
        - name: result
          in: query
          schema: { type: string, enum: [AWAIT_INTERVIEW, INTERVIEW_PASSED, INTERVIEW_FAILED] }
        - name: feedback_contains
          in: query
          schema: { type: string }
          description: Поиск по фидбеку (подстрока)
        # Диапазон дат
        - name: scheduled_at_from
          in: query
          schema: { type: integer, format: int64 }
        - name: scheduled_at_to
          in: query
          schema: { type: integer, format: int64 }
        # Пагинация и сортировка
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: sort_by
          in: query
          schema: { type: string, enum: [scheduled_at, result, candidate_name, tech_spec_name], default: scheduled_at }
        - name: sort_order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/InterviewResponse' } }
    post:
      summary: Назначить интервью кандидату
      description: Роль HR, ADMIN. Назначение интервью должно создавать связь ASSIGNED_FOR между кандидатом и интервью, а также связь INTERVIEWING между интервью и тех. специалистом. При назначении интервью статус кандидата автоматически меняется на AWAIT_INTERVIEW.
      tags: [Interviews]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterviewCreate' }
      responses:
        '201':
          description: Интервью создано, статус кандидата автоматически меняется на AWAIT_INTERVIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewResponse' }
        '400': { description: Кандидат не в статусе TEST или tech_spec не найден }

  /v2/interviews/{id}:
    get:
      summary: Получить информацию об интервью
      description: Роль - любая
      tags: [Interviews]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
            description: OK
            content:
                application/json: { schema: { $ref: '#/components/schemas/InterviewResponse' } }
        '404': { description: Не найдено }
    patch:
      summary: Добавить фидбек по интервью (связь INTERVIEWING)
      description: Роль TECH_SPEC. Фидбэк + INTERVIEW_PASSED или INTERVIEW_FAILED
      tags: [Interviews]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                feedback: { type: string, maxLength: 2000 }
                result: { type: string, enum: [INTERVIEW_PASSED, INTERVIEW_FAILED] }
              required: [feedback, result]
      responses:
        '200':
          description: Фидбек сохранён. При INTERVIEW_PASSED статус кандидата → INTERVIEW_PASSED, при INTERVIEW_FAILED статус кандидата → INTERVIEW_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewResponse' }
        '404': { description: Интервью не найдено }

  # ==================== Offers ====================
  /v2/offers:
    get:
      summary: Список офферов
      tags: [Offers]
      description: Фильтрация по основным параметрам
      security: [{ BearerAuth: [] }]
      parameters:
        - name: salary_from
          in: query
          schema: { type: integer, minimum: 0 }
          description: Минимальная зарплата
        - name: salary_to
          in: query
          schema: { type: integer, minimum: 0 }
          description: Максимальная зарплата
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, APPROVED_MNG, REJECTED_MNG, APPROVED_CND, REJECTED_CNF] }
          description: Статус оффера
        - name: start_at_from
          in: query
          schema: { type: integer, format: int64 }
          description: Дата выхода на работу от (Unix timestamp)
        - name: start_at_to
          in: query
          schema: { type: integer, format: int64 }
          description: Дата выхода на работу до (Unix timestamp)
        - name: candidate_id
          in: query
          schema: { type: string, format: uuid }
        - name: candidate_name
          in: query
          schema: { type: string }
          description: Поиск по имени кандидата (подстрока, регистронезависимый)
        - name: candidate_email
          in: query
          schema: { type: string, format: email }
          description: Поиск по email кандидата (подстрока)
        - name: candidate_status
          in: query
          schema: { type: string, enum: [NEW, TEST, AWAIT_INTERVIEW, INTERVIEW_FAILED, INTERVIEW_PASSED, OFFER, REJECTED, HIRED] }
          description: Статус кандидата

        - name: vacancy_id
          in: query
          schema: { type: string, format: uuid }
        - name: vacancy_title
          in: query
          schema: { type: string }
          description: Поиск по названию вакансии (подстрока)
        - name: vacancy_status
          in: query
          schema: { type: string, enum: [OPEN, CLOSED] }

        - name: created_by
          in: query
          schema: { type: string, format: uuid }
          description: ID менеджера, создавшего оффер
        - name: created_by_name
          in: query
          schema: { type: string }
          description: Поиск по имени создателя (подстрока)

        - name: created_at_from
          in: query
          schema: { type: integer, format: int64 }
        - name: created_at_to
          in: query
          schema: { type: integer, format: int64 }

        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }

        - name: sort_by
          in: query
          schema: { type: string, enum: [salary, start_at, status, created_at, candidate_name, vacancy_title], default: created_at }
        - name: sort_order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }

      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/OfferResponse' } }
        '403': { description: Недостаточно прав (требуется MANAGER, HR или ADMIN) }
    post:
      summary: Создать оффер для кандидата (связи CREATES, OFFERED, CLOSES)
      description: Роль HR, MANAGER, ADMIN. При создании оффера статус кандидата автоматически меняется на OFFER. Создавать оффер можно только для кандидата без офферов в статусе INTERVIEW_PASSED
      tags: [Offers]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferCreate' }
      responses:
        '201':
          description: Оффер создан, статус кандидата → OFFER
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfferResponse' }
        '400': { description: Кандидат не в статусе INTERVIEW_PASSED или уже есть активный оффер }

  /v2/offers/{id}:
    get:
      summary: Получить оффер по ID
      description: Роль MANAGER, HR, ADMIN может видеть офферы.
      tags: [Offers]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
            description: OK
            content:
                application/json: { schema: { $ref: '#/components/schemas/OfferResponse' } }
        '404': { description: Не найдено }
    patch:
      summary: Обновить статус оффера (согласование менеджером или кандидатом)
      description: Роль MANAGER
      tags: [Offers]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [APPROVED_MNG, REJECTED_MNG, APPROVED_CND, REJECTED_CNF] }
              required: [status]
      responses:
        '200':
          description: Статус обновлён. При APPROVED_CND статус кандидата → HIRED, вакансия → CLOSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfferResponse' }
        '400': { description: Некорректная последовательность статусов }
        '404': { description: Оффер не найден }

  # ==================== Analytics ====================
  /v2/analytics/statistics:
    get:
      summary: Данные для диаграммы
      description: |
        Роль - все, кроме техспециалиста, но при желании можем сделать доступным для всех (на обсуждении)
        Поддерживается 6 видов графиков в зависимости от комбинации x_axis и y_axis.
        - x_axis=status, y_axis=count      → распределение кандидатов по статусам
        - x_axis=status, y_axis=avg_salary → средняя зарплата по статусам
        - x_axis=vacancy, y_axis=count     → количество кандидатов по вакансиям
        - x_axis=vacancy, y_axis=avg_salary→ средняя зарплата по вакансиям
        - x_axis=date, y_axis=count        → динамика количества кандидатов по дням
        - x_axis=date, y_axis=avg_salary   → динамика средней зарплаты по дням
      tags: [Analytics]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: vacancy_id
          in: query
          schema:
            type: string
            format: uuid
          description: Фильтр по конкретной вакансии (опционально)
        - name: x_axis
          in: query
          required: true
          schema:
            type: string
            enum: [status, vacancy, date]
          description: |
            Группировка данных:
            - status — по статусу кандидата
            - vacancy — по вакансии
            - date — по дням (в labels возвращается строка YYYY-MM-DD)
        - name: y_axis
          in: query
          required: true
          schema:
            type: string
            enum: [count, avg_salary]
          description: |
            Показываемое значение:
            - count — количество кандидатов
            - avg_salary — средняя зарплата по офферам (для кандидатов, у которых есть оффер)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    nullable: true
                    description: |
                      Сумма значений в поле `values` для y_axis=count.
                      Для y_axis=avg_salary возвращается null.
                  labels:
                    type: array
                    items:
                      type: string
                    description: |
                      Подписи оси X:
                      - при x_axis=status — названия статусов (например, NEW, INTERVIEW, OFFER)
                      - при x_axis=vacancy — названия вакансий
                      - при x_axis=date — даты в формате YYYY-MM-DD
                  values:
                    type: array
                    items:
                      type: number
                    description: |
                      Числовые значения оси Y:
                      - при y_axis=count — целые числа (количество кандидатов)
                      - при y_axis=avg_salary — числа с плавающей точкой (средняя зарплата)
                required: [labels, values]
        '400':
          description: Некорректная комбинация параметров (например, date+avg_salary, если нет данных)
        '401':
          description: Не авторизован
        '404':
          description: id не найден

