      summary: Получить кандидата по ID
      description: Роль - любая
      tags: [Candidates]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
            description: OK
            content:
                application/json: { schema: { $ref: '#/components/schemas/CandidateResponse' } }
        '404': { description: Не найдено }
    patch:
      summary: Редактирование кандидата (включая статус и назначение теста)
      description: Роль HR.
      tags: [Candidates]
      security: [{ BearerAuth: [] }]
      parameters:
