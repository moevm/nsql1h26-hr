  # ==================== Auth ====================
  /v2/auth/register:
    post:
      summary: Регистрация пользователя
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201': { description: Пользователь создан, content: { application/json: { schema: { $ref: '#/components/schemas/UserResponse' } } } }
        '400': { description: Неверные данные }
        '409': { description: Email уже существует }

  /v2/auth/login:
    post:
      summary: Вход в систему
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
              required: [email, password]
      responses:
        '200':
          description: Успешный вход в систему
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string, enum: [ADMIN, HR, TECH_SPEC, MANAGER] }
                  user: { $ref: '#/components/schemas/UserResponse' }
        '401': { description: Неверные учётные данные }

  # ==================== Vacancies ====================
  /v2/vacancies:
    get:
      summary: Список вакансий
      tags: [Vacancies]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: title
          in: query
          schema: { type: string }
          description: Поиск по подстроке
        - name: description_contains
          in: query
          schema: { type: string }
          description: Поиск по описанию (подстрока)
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, CLOSED] }
        - name: created_at_from
          in: query
          schema: { type: integer, format: int64 }
          description: Unix timestamp (включительно)
        - name: created_at_to
          in: query
          schema: { type: integer, format: int64 }
          description: Unix timestamp (включительно)
        - name: closed_at_from
          in: query
          schema: { type: integer, format: int64 }
        - name: closed_at_to
          in: query
          schema: { type: integer, format: int64 }
        - name: has_test_tasks
          in: query
          schema: { type: boolean }
          description: Фильтр по наличию тестовых заданий
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: sort_by
          in: query
          schema: { type: string, enum: [title, status, created_at, closed_at], default: created_at }
        - name: sort_order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/VacancyResponse' } }

    post:
      summary: Создание вакансии
      description: Роль HR и ADMIN может создавать вакансии. При создании статус всегда OPEN, закрывать вакансию можно только через оффер.
      tags: [Vacancies]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VacancyCreate' }
      responses:
        '201':
          description: Вакансия создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacancyResponse' }
  /v2/vacancies/{id}:
    get:
      summary: Получить вакансию по ID
      description: Роль HR, ADMIN, MANAGER может получать вакансии. 
      tags: [Vacancies]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacancyResponse' }
        '404': 
            description: Не найдено
    patch:
      summary: Обновить вакансию
      description: Роль HR, ADMIN может обновлять вакансии.
      tags: [Vacancies]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 100 }
                description: { type: string, maxLength: 5000 }
                status: { type: string, enum: [OPEN, CLOSED] }
                closed_at: { type: integer, format: int64 }
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacancyResponse' }
        '404': 
            description: Не найдено

  # ==================== Test Tasks (новая сущность) ====================
  /v2/test-tasks:
    get:
      summary: Список тестовых заданий
      tags: [TestTasks]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: title
          in: query
          schema: { type: string }
          description: Поиск по подстроке
        - name: vacancy_id
          in: query
          schema: { type: string, format: uuid }
        - name: vacancy_title
          in: query
          schema: { type: string }
          description: Поиск по названию вакансии (связанная сущность)
        - name: test_task_url_contains
          in: query
          schema: { type: string }
          description: Поиск по ссылке (подстрока)
        - name: has_assigned_candidates
          in: query
          schema: { type: boolean }
          description: Есть ли кандидаты с этим тестовым
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: sort_by
          in: query
          schema: { type: string, enum: [title, vacancy_id, created_at], default: title }
        - name: sort_order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/TestTaskResponse' } }

    post:
      summary: Создать тестовое задание для вакансии
      tags: [TestTasks]
      description: Роль HR. Тестовое задание должно быть связано с вакансией (vacancy_id), для которой оно предназначено (связь TEST_FOR). В одной вакансии может быть несколько тестовых заданий
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestTaskCreate' }
      responses:
        '201': 
             description: Создано тестовое
             content: 
                application/json: { schema: { $ref: '#/components/schemas/TestTaskResponse' } } 
        '404': { description: Вакансия не найдена }

  /v2/test-tasks/{id}:
    get:
      summary: Получить тестовое задание по ID
      description: Роль - любая
      tags: [TestTasks]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': 
            description: OK
            content: { application/json: { schema: { $ref: '#/components/schemas/TestTaskResponse' } } }
        '404': { description: Не найдено }
    patch:
      summary: Обновить тестовое задание
      description: Роль HR, ADMIN может обновлять тестовые задания.
      tags: [TestTasks]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 100 }
                test_task_url: { type: string, format: uri }
      responses:
        '200': 
            description: OK
            content: { application/json: { schema: { $ref: '#/components/schemas/TestTaskResponse' } } }
        '404': { description: Не найдено }
    delete:
      summary: Удалить тестовое задание
      description: Роль HR, ADMIN может удалять тестовые задания. Удаление тестового задания должно автоматически снимать его со всех кандидатов, которым оно было назначено (связь COMPLETES)
      tags: [TestTasks]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Удалено }
        '404': { description: Не найдено }

  # ==================== Candidates ====================
  /v2/candidates:
    get:
      summary: Список кандидатов
      description: Роль - любая ?????????
      tags: [Candidates]
      security: [{ BearerAuth: [] }]
      parameters:
        # Текстовые поля
        - name: full_name
          in: query
          schema: { type: string }
        - name: email
          in: query
          schema: { type: string }
        - name: phone
          in: query
          schema: { type: string }
        - name: resume_url_contains
          in: query
          schema: { type: string }
        # Статус
        - name: status
          in: query
          schema: { type: string, enum: [NEW, TEST, INTERVIEW, OFFER, REJECTED, HIRED] }
        # Связи
        - name: vacancy_id
          in: query
          schema: { type: string, format: uuid }
        - name: vacancy_title
          in: query
          schema: { type: string }
          description: Поиск по названию вакансии
        - name: test_task_id
          in: query
          schema: { type: string, format: uuid }
        - name: test_task_title
          in: query
          schema: { type: string }
          description: Поиск по названию тестового задания
        # Диапазоны (если будут числовые поля)
        - name: created_at_from
          in: query
          schema: { type: integer, format: int64 }
        - name: created_at_to
          in: query
          schema: { type: integer, format: int64 }
        # Составные фильтры
        - name: has_interview
          in: query
          schema: { type: boolean }
          description: Есть ли назначенное интервью
        - name: has_offer
          in: query
          schema: { type: boolean }
          description: Есть ли оффер
        # Пагинация и сортировка
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: sort_by
          in: query
          schema: { type: string, enum: [full_name, email, status, created_at, updated_at], default: created_at }
        - name: sort_order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/CandidateResponse' } }

    post:
      summary: Добавление кандидата
      description: Роль HR, ADMIN. При добавлении кандидат должен быть связан с вакансией. Статус при добавлении всегда NEW
      tags: [Candidates]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateCreate' }
      responses:
        '201':
            description: OK
            content: 
                application/json: { schema: { $ref: '#/components/schemas/CandidateResponse' } } 
        '400': { description: Vacancy не найдена или TestTask не принадлежит Vacancy }

  /v2/candidates/{id}:
    get:
      summary: Получить кандидата по ID
      description: Роль - любая
      tags: [Candidates]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':  
            description: OK
            content: 
                application/json: { schema: { $ref: '#/components/schemas/CandidateResponse' } }
        '404': { description: Не найдено }
    patch:
      summary: Редактирование кандидата (включая статус и назначение теста)
      description: Роль HR.
      tags: [Candidates]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string, maxLength: 150 }
                email: { type: string, format: email }
                phone: { type: string, pattern: '^\+7\d{10}$' }
                resume_url: { type: string, format: uri }
                status: { type: string, enum: [NEW, TEST, INTERVIEW, OFFER, REJECTED, HIRED] }
                vacancy_id: { type: string, format: uuid }
                test_task_id: { type: string, format: uuid, description: "Назначить тест (связь COMPLETES)" }
      responses:
        '200': 
            description: OK
            content: 
                application/json: { schema: { $ref: '#/components/schemas/CandidateResponse' } }
        '400': { description: Некорректный переход статуса или test_task_id не принадлежит vacancy_id }
        '404': { description: Не найдено }

  /v2/candidates/import:
    post:
      summary: Массовый импорт кандидатов из CSV
      description: Роль HR, ADMIN
      tags: [Candidates]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  
      responses:
        '200':
          description: Импорт выполнен
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  errors: { type: array, items: { type: string } }

  # ==================== Interviews ====================
  /v2/interviews:
    get:
      summary: Список интервью
      tags: [Interviews]
      parameters:
        # Прямые поля
        - name: candidate_id
          in: query
          schema: { type: string, format: uuid }
        - name: candidate_name
          in: query
          schema: { type: string }
          description: Поиск по имени кандидата
        - name: tech_spec_id
          in: query
          schema: { type: string, format: uuid }
        - name: tech_spec_name
          in: query
          schema: { type: string }
          description: Поиск по имени техспециалиста
        - name: result
          in: query
          schema: { type: string, enum: [AWAIT_INTERVIEW, INTERVIEW_PASSED, INTERVIEW_FAILED] }
        - name: feedback_contains
          in: query
          schema: { type: string }
          description: Поиск по фидбеку (подстрока)
        # Диапазон дат
        - name: scheduled_at_from
          in: query
          schema: { type: integer, format: int64 }
        - name: scheduled_at_to
          in: query
          schema: { type: integer, format: int64 }
        # Пагинация и сортировка
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: sort_by
          in: query
          schema: { type: string, enum: [scheduled_at, result, candidate_name, tech_spec_name], default: scheduled_at }
        - name: sort_order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/InterviewResponse' } }
    post:
      summary: Назначить интервью кандидату
      description: Роль HR, ADMIN. Назначение интервью должно создавать связь ASSIGNED_FOR между кандидатом и интервью, а также связь INTERVIEWING между интервью и тех. специалистом. При назначении интервью статус кандидата автоматически меняется на INTERVIEW.
      tags: [Interviews]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterviewCreate' }
      responses:
        '201':
          description: Интервью создано, статус кандидата автоматически меняется на INTERVIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewResponse' }
        '400': { description: Кандидат не в статусе TEST или tech_spec не найден }

  /v2/interviews/{id}:
    get:
      summary: Получить информацию об интервью
      description: Роль - любая
      tags: [Interviews]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': 
            description: OK
            content:  
                application/json: { schema: { $ref: '#/components/schemas/InterviewResponse' } }
        '404': { description: Не найдено }
    patch:
      summary: Добавить фидбек по интервью (связь INTERVIEWING)
      description: Роль TECH_SPEC. Фидбэк + INTERVIEW_PASSED или INTERVIEW_FAILED
      tags: [Interviews]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                feedback: { type: string, maxLength: 2000 }
                result: { type: string, enum: [INTERVIEW_PASSED, INTERVIEW_FAILED] }
              required: [feedback, result]
      responses:
        '200':
          description: Фидбек сохранён. При INTERVIEW_PASSED статус кандидата → OFFER
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewResponse' }
        '404': { description: Интервью не найдено }

