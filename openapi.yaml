  # ==================== Auth ====================
  /v2/auth/register:
    post:
      summary: Регистрация нового пользователя
      description: |
        Создание новой учетной записи.
        
        **Правила валидации:**
        - Email должен быть уникальным
        - Пароль: минимум 6 символов
        - ФИО: от 3 до 150 символов
        
        **Ролевая модель:**
        - При регистрации через этот эндпоинт роль всегда `HR` (для демо)
        - В production роль должна быть ограничена или требовать подтверждения
      tags: 
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - full_name
                - password
              properties:
                email:
                  type: string
                  format: email
                  minLength: 1
                  maxLength: 255
                  example: "hr@example.com"
                  description: "Email пользователя (уникальный)"
                full_name:
                  type: string
                  minLength: 3
                  maxLength: 150
                  example: "HR Менеджер"
                  description: "Полное имя пользователя"
                password:
                  type: string
                  minLength: 6
                  maxLength: 100
                  format: password
                  example: "hr123"
                  description: "Пароль (минимум 6 символов)"
                role:
                  type: string
                  enum: [ADMIN, HR, TECH_SPEC, MANAGER]
                  default: HR
                  description: "Роль пользователя (опционально, по умолчанию HR)"
            examples:
              hr_user:
                summary: "Регистрация HR"
                value:
                  email: "hr@example.com"
                  full_name: "HR Менеджер"
                  password: "hr123"
                  role: "HR"
              tech_spec:
                summary: "Регистрация техспециалиста"
                value:
                  email: "tech@example.com"
                  full_name: "Технический Специалист"
                  password: "tech123"
                  role: "TECH_SPEC"
      responses:
        '201':
          description: "Пользователь успешно создан"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: "Уникальный идентификатор пользователя"
                    example: "262995c7-7fae-4b2f-a1dc-655660154b2e"
                  email:
                    type: string
                    format: email
                    example: "hr@example.com"
                  full_name:
                    type: string
                    example: "HR Менеджер"
                  role:
                    type: string
                    enum: [ADMIN, HR, TECH_SPEC, MANAGER]
                    example: "HR"
              example:
                id: "262995c7-7fae-4b2f-a1dc-655660154b2e"
                email: "hr@example.com"
                full_name: "HR Менеджер"
                role: "HR"
        '400':
          description: "Неверные данные запроса"
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    oneOf:
                      - type: string
                        example: "Password must be at least 6 characters"
                      - type: array
                        items:
                          type: object
                          properties:
                            loc:
                              type: array
                              items:
                                type: string
                              example: ["body", "email"]
                            msg:
                              type: string
                              example: "value is not a valid email address"
                            type:
                              type: string
                              example: "value_error"
              examples:
                invalid_email:
                  value:
                    detail: [
                      {
                        "loc": ["body", "email"],
                        "msg": "value is not a valid email address",
                        "type": "value_error"
                      }
                    ]
                short_password:
                  value:
                    detail: "Password must be at least 6 characters"
                short_name:
                  value:
                    detail: "Full name must be at least 3 characters"
        '409':
          description: "Конфликт - пользователь с таким email уже существует"
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: "User with email hr@example.com already exists"
        '422':
          description: "Ошибка валидации"
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array
                    items:
                      type: object
      security: []  # не требует авторизации

  /v2/auth/login:
    post:
      summary: Вход в систему
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
              required: [email, password]
      responses:
        '200':
          description: Успешный вход в систему
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string, enum: [ADMIN, HR, TECH_SPEC, MANAGER] }
                  user: { $ref: '#/components/schemas/UserResponse' }
        '401': { description: Неверные учётные данные }

  # ==================== Vacancies ====================
  /v2/vacancies:
    get:
      summary: Список вакансий
      tags: [Vacancies]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: title
          in: query
          schema: { type: string }
          description: Поиск по подстроке
        - name: description_contains
          in: query
          schema: { type: string }
          description: Поиск по описанию (подстрока)
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, CLOSED] }
        - name: created_at_from
          in: query
          schema: { type: integer, format: int64 }
          description: Unix timestamp (включительно)
        - name: created_at_to
          in: query
          schema: { type: integer, format: int64 }
          description: Unix timestamp (включительно)
        - name: closed_at_from
          in: query
          schema: { type: integer, format: int64 }
        - name: closed_at_to
          in: query
          schema: { type: integer, format: int64 }
        - name: has_test_tasks
          in: query
          schema: { type: boolean }
          description: Фильтр по наличию тестовых заданий
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: sort_by
          in: query
          schema: { type: string, enum: [title, status, created_at, closed_at], default: created_at }
        - name: sort_order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/VacancyResponse' } }

    post:
      summary: Создание вакансии
      description: Роль HR и ADMIN может создавать вакансии. При создании статус всегда OPEN, закрывать вакансию можно только через оффер.
      tags: [Vacancies]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VacancyCreate' }
      responses:
        '201':
          description: Вакансия создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacancyResponse' }
  /v2/vacancies/{id}:
    get:
      summary: Получить вакансию по ID
      description: Роль HR, ADMIN, MANAGER может получать вакансии.
      tags: [Vacancies]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacancyResponse' }
        '404':
            description: Не найдено
    patch:
      summary: Обновить вакансию
      description: Роль HR, ADMIN может обновлять вакансии.
      tags: [Vacancies]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 100 }
                description: { type: string, maxLength: 5000 }
                status: { type: string, enum: [OPEN, CLOSED] }
                closed_at: { type: integer, format: int64 }
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacancyResponse' }
        '404':
            description: Не найдено

  # ==================== Test Tasks (новая сущность) ====================
  /v2/test-tasks:
    get:
      summary: Список тестовых заданий
      tags: [TestTasks]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: title
          in: query
          schema: { type: string }
          description: Поиск по подстроке
        - name: vacancy_id
          in: query
          schema: { type: string, format: uuid }
        - name: vacancy_title
          in: query
          schema: { type: string }
          description: Поиск по названию вакансии (связанная сущность)
        - name: test_task_url_contains
          in: query
          schema: { type: string }
          description: Поиск по ссылке (подстрока)
        - name: has_assigned_candidates
          in: query
          schema: { type: boolean }
          description: Есть ли кандидаты с этим тестовым
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: sort_by
          in: query
          schema: { type: string, enum: [title, vacancy_id, created_at], default: title }
        - name: sort_order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/TestTaskResponse' } }

    post:
      summary: Создать тестовое задание для вакансии
      tags: [TestTasks]
      description: Роль HR. Тестовое задание должно быть связано с вакансией (vacancy_id), для которой оно предназначено (связь TEST_FOR). В одной вакансии может быть несколько тестовых заданий
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestTaskCreate' }
      responses:
        '201':
             description: Создано тестовое
             content:
                application/json: { schema: { $ref: '#/components/schemas/TestTaskResponse' } }
        '404': { description: Вакансия не найдена }

  /v2/test-tasks/{id}:
    get:
      summary: Получить тестовое задание по ID
      description: Роль - любая
      tags: [TestTasks]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
            description: OK
            content: { application/json: { schema: { $ref: '#/components/schemas/TestTaskResponse' } } }
        '404': { description: Не найдено }
    patch:
      summary: Обновить тестовое задание
      description: Роль HR, ADMIN может обновлять тестовые задания.
      tags: [TestTasks]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 100 }
                test_task_url: { type: string, format: uri }
      responses:
        '200':
            description: OK
            content: { application/json: { schema: { $ref: '#/components/schemas/TestTaskResponse' } } }
        '404': { description: Не найдено }
    delete:
      summary: Удалить тестовое задание
      description: Роль HR, ADMIN может удалять тестовые задания. Удаление тестового задания должно автоматически снимать его со всех кандидатов, которым оно было назначено (связь COMPLETES)
      tags: [TestTasks]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Удалено }
        '404': { description: Не найдено }

  # ==================== Candidates ====================
  /v2/candidates:
    get:
      summary: Список кандидатов
      description: Роль - любая ?????????
      tags: [Candidates]
      security: [{ BearerAuth: [] }]
      parameters:
        # Текстовые поля
        - name: full_name
          in: query
          schema: { type: string }
        - name: email
          in: query
          schema: { type: string }
        - name: phone
          in: query
          schema: { type: string }
        - name: resume_url_contains
          in: query
          schema: { type: string }
        # Статус
        - name: status
          in: query
          schema: { type: string, enum: [NEW, TEST, AWAIT_INTERVIEW, INTERVIEW_FAILED, INTERVIEW_PASSED, OFFER, REJECTED, HIRED] }
        # Связи
        - name: vacancy_id
          in: query
          schema: { type: string, format: uuid }
        - name: vacancy_title
          in: query
          schema: { type: string }
          description: Поиск по названию вакансии
        - name: test_task_id
          in: query
          schema: { type: string, format: uuid }
        - name: test_task_title
          in: query
          schema: { type: string }
          description: Поиск по названию тестового задания
        # Диапазоны (если будут числовые поля)
        - name: created_at_from
          in: query
          schema: { type: integer, format: int64 }
        - name: created_at_to
          in: query
          schema: { type: integer, format: int64 }
        # Составные фильтры
        - name: has_interview
          in: query
          schema: { type: boolean }
          description: Есть ли назначенное интервью
        - name: has_offer
          in: query
          schema: { type: boolean }
          description: Есть ли оффер
        # Пагинация и сортировка
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: sort_by
          in: query
          schema: { type: string, enum: [full_name, email, status, created_at, updated_at], default: created_at }
        - name: sort_order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/CandidateResponse' } }

    post:
      summary: Добавление кандидата
      description: Роль HR, ADMIN. При добавлении кандидат должен быть связан с вакансией. Статус при добавлении всегда NEW
      tags: [Candidates]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateCreate' }
      responses:
        '201':
            description: OK
            content:
                application/json: { schema: { $ref: '#/components/schemas/CandidateResponse' } }
        '400': { description: Vacancy не найдена или TestTask не принадлежит Vacancy }

  /v2/candidates/{id}:
